schema_version: 1

context:
  name: google-ai-generativelanguage
  version: 0.12.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 1a210b7f284465d6e13c4153d58c6ede639e67fec84b85ab984bb74ed4269fb5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - grpcio >=1.59.0,<2.0.0
    - python >=${{ python_min }}
    - google-api-core >=2.28.0,<3.0.0
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    - proto-plus >=1.26.1,<2.0.0
    - protobuf >=6.33.5,<8.0.0
tests:
  - python:
      imports:
        - google
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Google Ai Generativelanguage API client library
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-ai-generativelanguage

extra:
  recipe-maintainers:
    - jan-janssen
